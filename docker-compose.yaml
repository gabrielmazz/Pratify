services:

  # ------------------------------------------------------------------------------------------------------------------ #

  # Criação do docker para o frontend, onde ele irá rodar na porta configurada no .env.
  # O frontend usa o proxy do Vite para encaminhar chamadas /api para o backend dentro da rede do Compose.
  frontend:
    build:
      context: ./frontend
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port ${FRONTEND_PORT}"
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_PROXY_TARGET: http://backend:${API_PORT}
    depends_on:
      - backend

  # Criação do docker para o banco de dados PostgreSQL.
  # A porta publicada no host pode mudar via .env, mas dentro da rede Docker o Postgres continua ouvindo em 5432.
  dbPostgres:
    image: postgres:16
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Criação do docker para o backend.
  # O serviço usa dotnet watch para desenvolvimento e fala com o banco pelo nome do serviço dbPostgres.
  backend:
    build:
      context: ./backend
    command: sh -c "dotnet restore && dotnet watch --non-interactive --project backend.csproj run --no-launch-profile"
    ports:
      - "${API_PORT}:${API_PORT}"
    volumes:
      - ./backend:/src
      - backend_nuget:/root/.nuget/packages
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:${API_PORT}
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      ConnectionStrings__Default: Host=dbPostgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Ollama__BaseUrl: ${OLLAMA_BASE_URL}
      Ollama__Model: ${OLLAMA_MODEL}
    depends_on:
      dbPostgres:
        condition: service_healthy

volumes:
  frontend_node_modules:
  backend_nuget:
  postgres_data:

  # ------------------------------------------------------------------------------------------------------------------ #
